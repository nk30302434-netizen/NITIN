<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriend Day My Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden !important;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #2d0015 0%, #590022 50%, #1a000a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SHINY SILVER SHOOTING STARS FOR PAGE 3 */
        .shooting-star-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5000;
            overflow: hidden;
        }

        .shooting-star {
            position: absolute;
            width: 110px;
            height: 1.5px;
            background: linear-gradient(90deg, #ffffff, rgba(220, 230, 255, 0.9), transparent);
            filter: drop-shadow(0 0 6px #ffffff);
            opacity: 0;
        }

        .shooting-star::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3.5px;
            height: 3.5px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffffff;
        }

        @keyframes shootAngle1 {
            0% { transform: translate(0, 0) rotate(-38deg); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { transform: translate(-120vw, 120vh) rotate(-38deg); opacity: 0; }
        }

        .screen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(74, 0, 35, 0.92) 0%, rgba(26, 0, 12, 0.96) 90%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        .global-music-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle, #ff0055 25%, #111 85%);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.9);
            cursor: pointer;
            z-index: 6000;
        }

        .question-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #ff4d88;
            text-shadow: 0 0 15px rgba(255, 77, 136, 0.8);
            line-height: 1.3;
        }

        .funny-status {
            font-size: 1rem;
            color: #ffccd5;
            min-height: 20px;
            margin-bottom: 20px;
            font-weight: 500;
            padding: 0 15px;
            max-width: 350px;
        }

        /* INPUT FIELD STYLING FOR PAGE 1 */
        .datetime-input {
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 30px;
            border: 2px solid rgba(255, 100, 150, 0.6);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            width: 80%;
            max-width: 280px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        .datetime-input::placeholder {
            color: #ffccd5;
        }

        .btn-group {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 300px;
            height: 140px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.25s ease-out;
            white-space: nowrap;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff0055, #ff5079);
            color: white;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
            position: relative;
            z-index: 5;
        }

        .btn-no {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        .heart-btn {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #ff0055, #ff5079);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 0, 85, 1);
            animation: pulse 1.4s infinite;
            border: none;
            color: white;
            margin-top: 20px;
        }

        .screen4-wrapper {
            position: relative;
            width: 92%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1005;
        }

        .outside-header-box {
            position: relative;
            margin-bottom: 12px;
            text-align: center;
            min-height: 65px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .dear-text-glowing {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #ffffff;
            text-shadow: 0 0 10px #ffffff, 0 0 20px #ff4d88, 0 0 30px #ff0055;
            white-space: pre;
            letter-spacing: 1px;
            display: inline-block;
        }

        .clean-emoji {
            font-family: sans-serif !important;
            font-size: 2.2rem;
            filter: none !important;
            text-shadow: none !important;
            margin-left: 6px;
            display: inline-block;
            vertical-align: middle;
        }

        .cursor {
            font-weight: 300;
            font-size: 2.8rem;
            color: #ffffff;
            animation: blink 0.7s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .rocket-anim {
            position: absolute;
            bottom: -50px;
            font-size: 30px;
            opacity: 0;
            pointer-events: none;
        }

        .rocket-anim.fly {
            animation: launchRocket 0.9s ease-in forwards;
        }

        @keyframes launchRocket {
            0% { transform: translateY(100px) scale(0.5); opacity: 1; }
            80% { transform: translateY(-30px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-40px) scale(1.8); opacity: 0; }
        }

        .heavy-smoke-cloud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(255, 180, 210, 0.95) 0%, rgba(255, 0, 85, 0.8) 40%, rgba(255, 255, 255, 0) 80%);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            filter: blur(12px);
        }

        .heavy-smoke-cloud.burst {
            animation: slowSmokeExplode 2.5s ease-out forwards;
        }

        @keyframes slowSmokeExplode {
            0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; }
            40% { opacity: 0.9; transform: translate(-50%, -50%) scale(2.5); }
            100% { transform: translate(-50%, -50%) scale(4.0); opacity: 0; }
        }

        .card-container {
            position: relative;
            width: 100%;
            max-height: 85vh;
            background: rgba(45, 0, 20, 0.65);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 100, 150, 0.35);
            border-radius: 25px;
            padding: 16px 12px 20px 12px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 85, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 2.1rem;
            line-height: 1.1;
            color: #ffffff;
            text-shadow: 0 0 15px #ff0055;
        }

        .subtitle {
            font-size: 0.72rem;
            color: #ffccd5;
            letter-spacing: 1px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .photo-collage-wrapper {
            position: relative;
            width: 100%;
            max-width: 270px;
            margin: 0 auto 8px auto;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 8px;
            background: rgba(255, 0, 85, 0.2);
            border-radius: 18px;
            border: 2px solid rgba(255, 150, 180, 0.5);
        }

        .photo-box {
            position: relative;
            width: 100%;
            height: 90px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #ff80a0;
            background: rgba(255, 255, 255, 0.1);
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .music-logo {
            position: absolute;
            top: -12px;
            right: -12px;
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #ff0055 25%, #111 85%);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.9);
            cursor: pointer;
            z-index: 20;
        }

        .spin {
            animation: rotateDisc 3s linear infinite;
        }

        .wishes-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }

        .wish-badge {
            background: rgba(255, 0, 85, 0.3);
            border: 1px solid rgba(255, 150, 180, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            opacity: 0;
            transform: scale(0.2);
            transition: all 0.5s ease-out;
        }

        .wish-badge.show {
            opacity: 1;
            transform: scale(1);
        }

        .slow-mo-heart {
            position: fixed;
            pointer-events: none;
            animation: floatSlowMo 7s linear infinite;
            z-index: 2500;
            opacity: 0.35;
            filter: drop-shadow(0 0 4px rgba(255, 100, 150, 0.4));
        }

        @keyframes rotateDisc {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        @keyframes floatSlowMo {
            0% { transform: translateY(105vh) scale(0.6) rotate(-5deg); opacity: 0; }
            25% { opacity: 0.35; }
            75% { opacity: 0.35; }
            100% { transform: translateY(-15vh) scale(1) rotate(10deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="shooting-star-container" id="shootingStarBg" style="display: none;"></div>

    <!-- PAGE 1: Date & Time Entry Screen -->
    <div id="page1" class="screen-overlay">
        <div class="global-music-logo" id="musicLogo1" onclick="toggleAudio()">🎵</div>
        <h2 class="question-title">Enter Today's Date & Time for Your Surprise 🗓️✨</h2>
        <div class="funny-status" id="dateErrorText"></div>
        
        <input type="text" id="dateTimeInput" class="datetime-input" placeholder="31 July, 3:15 PM 🌹">
        <button class="btn btn-yes" onclick="submitDateTime()">ENTER 💖</button>
    </div>

    <!-- PAGE 2: Prank Screen -->
    <div id="page2" class="screen-overlay" style="display: none;">
        <div class="global-music-logo" id="musicLogo2" onclick="toggleAudio()">🎵</div>
        <h2 class="question-title">Do you want to see a surprise? 😉</h2>
        <div class="funny-status" id="funnyText">If you want to see the surprise, click YES! 😁</div>
        
        <div class="btn-group">
            <button class="btn btn-yes" id="yesBtn" onclick="handleYesClick()">YES ❤️</button>
            <button class="btn btn-no" onclick="handleNoClick()">NO 😜</button>
        </div>
    </div>

    <!-- PAGE 3: Heart Screen -->
    <div id="page3" class="screen-overlay" style="display: none;">
        <div class="global-music-logo" id="musicLogo3" onclick="toggleAudio()">🎵</div>
        <h2 style="font-weight: 300; letter-spacing: 2px; text-shadow: 0 0 15px #ff0055;">SPECIAL SURPRISE FOR YOU 💖</h2>
        <button class="heart-btn" onclick="openSurprise()">❤️</button>
        <p style="margin-top: 15px; font-size: 0.85rem; color: #ffccd5;">Tap the heart to open</p>
    </div>

    <!-- PAGE 4: Main Romantic Card -->
    <div class="screen4-wrapper" id="page4" style="display: none;">
        <div class="outside-header-box">
            <div class="rocket-anim" id="rocketIcon">🚀</div>
            <div class="heavy-smoke-cloud" id="heavySmoke"></div>
            
            <h2>
                <span class="dear-text-glowing" id="typewriterText"></span>
                <span class="cursor" id="typingCursor">|</span>
                <span class="clean-emoji" id="cleanEmoji"></span>
            </h2>
        </div>

        <div class="card-container">
            <div>
                <h1 class="title">Happy Girlfriend Day</h1>
                <p class="subtitle">TO THE ONE WHO HAS MY HEART ❤️</p>
            </div>

            <div class="photo-collage-wrapper">
                <div class="photo-grid">
                    <div class="photo-box"><img src="https://i.ibb.co/KjqgkkFW/Snapchat-2123988936.jpg" alt="1"></div>
                    <div class="photo-box"><img src="https://i.ibb.co/4HL10wn/Screenshot-20260731-143933-Gallery.jpg" alt="2"></div>
                    <div class="photo-box"><img src="https://i.ibb.co/HTk7nRmn/Screenshot-20260731-142146-Gallery.jpg" alt="3"></div>
                    <div class="photo-box"><img src="https://i.ibb.co/j9rqqkpK/Snapchat-1504952516.jpg" alt="4"></div>
                </div>

                <div class="music-logo" id="musicLogo4" onclick="toggleAudio()">
                    🎵
                </div>
            </div>

            <div class="wishes-wrapper" id="wishesContainer"></div>
        </div>
    </div>

    <!-- AUDIO ELEMENT PRELOADED WITH AUTO-BUFFER -->
    <audio id="bgMusic" preload="auto" loop>
        <source src="https://archive.org/download/audio-cutter-tu-hi-mera-full-video-emraan-hashmi-esha-gupta-jannat-2-shafqat-ama/AudioCutter_Tu%20Hi%20Mera%20-%20Full%20Video%20_%20Emraan%20Hashmi_%20Esha%20Gupta%20_%20Jannat%202%20_%20Shafqat%20Amanat%20Ali%20_%20Pritam%28MP3_160K%29.mp3" type="audio/mpeg">
    </audio>

    <script>
        let yesClickCount = 0;
        let shootingStarTimer;
        let musicStarted = false;
        
        const yesBtn = document.getElementById('yesBtn');
        const funnyText = document.getElementById('funnyText');
        const audio = document.getElementById('bgMusic');
        const logo1 = document.getElementById('musicLogo1');
        const logo2 = document.getElementById('musicLogo2');
        const logo3 = document.getElementById('musicLogo3');
        const logo4 = document.getElementById('musicLogo4');

        // INSTANT AUDIO TRIGGER & PRE-BUFFER ON LOAD
        window.addEventListener('DOMContentLoaded', () => {
            audio.load();
        });

        function forcePlayAudio() {
            if (!musicStarted) {
                audio.volume = 1.0;
                audio.play().then(() => {
                    musicStarted = true;
                    logo1.classList.add('spin');
                    logo2.classList.add('spin');
                    logo3.classList.add('spin');
                    logo4.classList.add('spin');
                }).catch((e) => {
                    console.log("Audio play blocked: ", e);
                });
            }
        }

        document.addEventListener('click', forcePlayAudio, { once: true });
        document.addEventListener('touchstart', forcePlayAudio, { once: true });

        // SUBMIT DATE & TIME FROM PAGE 1 TO PAGE 2
        function submitDateTime() {
            forcePlayAudio();
            const inputVal = document.getElementById('dateTimeInput').value.trim();
            if (inputVal === "") {
                document.getElementById('dateErrorText').innerText = "Please enter the date and time! 🥰";
                return;
            }
            // Move to Page 2
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'flex';
        }

        function handleYesClick() {
            forcePlayAudio();
            yesClickCount++;

            if (yesClickCount === 1) {
                yesBtn.style.transform = 'translate(-80px, -50px)';
                funnyText.innerText = "Hehe pakad ke dikhao! 🤪🏃‍♀️";
            } else if (yesClickCount === 2) {
                yesBtn.style.transform = 'translate(60px, 40px)';
                funnyText.innerText = "Nahi pakad paogi! 🙈🤣";
            } else if (yesClickCount === 3) {
                yesBtn.style.transform = 'translate(70px, -45px)';
                funnyText.innerText = "Arey re, itni koshish! 😜✨";
            } else if (yesClickCount === 4) {
                yesBtn.style.transform = 'translate(-80px, 40px)';
                funnyText.innerText = "Almost pakad liya tha! 😂💖";
            } else if (yesClickCount === 5) {
                yesBtn.style.transform = 'translate(0px, 0px)';
                funnyText.innerText = "Okay, okay done! 😇 Now click YES to see your surprise!";
            } else {
                goToPage3();
            }
        }

        function handleNoClick() {
            forcePlayAudio();
            funnyText.innerText = "NO nahi dabana hai! Pehle YES pakad ke dikhao! 😜❤️";
        }

        function goToPage3() {
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page3').style.display = 'flex';
            document.getElementById('shootingStarBg').style.display = 'block';
            
            spawnTopCornerStar();
            startShootingStars();
        }

        function openSurprise() {
            document.getElementById('page3').style.display = 'none';
            document.getElementById('page4').style.display = 'flex';
            
            document.getElementById('shootingStarBg').style.display = 'none';
            clearInterval(shootingStarTimer);
            
            if (!audio.paused) {
                logo4.classList.add('spin');
            }

            const rocket = document.getElementById('rocketIcon');
            const smoke = document.getElementById('heavySmoke');

            rocket.classList.add('fly');

            setTimeout(() => {
                smoke.classList.add('burst');
            }, 600);

            setTimeout(() => {
                typeSlowLiveName("Dear Aroh");
            }, 1200);

            burstWishes();
            createSlowMoHearts();
        }

        function toggleAudio() {
            if (audio.paused) {
                audio.play();
                logo1.classList.add('spin');
                logo2.classList.add('spin');
                logo3.classList.add('spin');
                logo4.classList.add('spin');
            } else {
                audio.pause();
                logo1.classList.remove('spin');
                logo2.classList.remove('spin');
                logo3.classList.remove('spin');
                logo4.classList.remove('spin');
            }
        }

        function typeSlowLiveName(text) {
            const target = document.getElementById('typewriterText');
            const cursor = document.getElementById('typingCursor');
            const emojiTarget = document.getElementById('cleanEmoji');
            target.innerText = "";
            let i = 0;

            let timer = setInterval(() => {
                if (i < text.length) {
                    target.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(timer);
                    emojiTarget.innerText = " 💖✨";
                    setTimeout(() => { cursor.style.display = 'none'; }, 1200);
                }
            }, 180);
        }

        const wishes = [
            "🌸 My Princess",
            "💖 You Are My World",
            "👑 Best Girlfriend Ever",
            "✨ Pure Magic",
            "💍 Forever & Always",
            "🌹 Favourite Smile",
            "💕 Love You Endless"
        ];

        function burstWishes() {
            const container = document.getElementById('wishesContainer');
            wishes.forEach((text, index) => {
                setTimeout(() => {
                    const badge = document.createElement('div');
                    badge.className = 'wish-badge';
                    badge.innerText = text;
                    container.appendChild(badge);

                    setTimeout(() => badge.classList.add('show'), 50);
                }, index * 250);
            });
        }

        function spawnTopCornerStar() {
            const container = document.getElementById('shootingStarBg');
            const star = document.createElement('div');
            star.className = 'shooting-star';
            
            star.style.top = (Math.random() * 6 + 2) + 'vh';
            star.style.left = (Math.random() * 15 + 80) + 'vw';
            star.style.animation = 'shootAngle1 2.2s linear forwards';
            
            container.appendChild(star);

            setTimeout(() => star.remove(), 2400);
        }

        function startShootingStars() {
            shootingStarTimer = setInterval(() => {
                spawnTopCornerStar();
            }, 1000);
        }

        function createSlowMoHearts() {
            const heartIcons = ['❤️', '💕', '💖'];
            setInterval(() => {
                const heart = document.createElement('div');
                heart.className = 'slow-mo-heart';
                heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
                
                heart.style.left = Math.random() * 92 + 'vw';
                heart.style.fontSize = (Math.random() * 12 + 16) + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 6) + 's';
                
                document.body.appendChild(heart);

                setTimeout(() => heart.remove(), 9000);
            }, 850);
        }
    </script>
</body>
</html>
